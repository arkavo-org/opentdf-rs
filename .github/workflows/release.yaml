name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'crates/wasm/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/release.yaml'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Release gates. `build` (tag, npm publish, GitHub release) and, through it,
  # the crates.io dispatch only run when both `verify-*` jobs are green. They
  # run on every push that triggers this workflow, not only on version bumps.

  # Same steps as the `test` job in feature.yaml; keep them identical.
  verify-tests:
    name: verify-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: setup-rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: run-tests
        run: cargo test --verbose

      - name: run-tests-all-features
        run: cargo test --all-features --verbose

  # Same check as the `advisories` leg of the cargo-deny job in feature.yaml.
  # Dependencies are resolved fresh here, so an advisory published after the
  # last PR still blocks the release.
  verify-advisories:
    name: verify-advisories
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: audit-advisories
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          arguments: --all-features

  build:
    name: build
    needs: [verify-tests, verify-advisories]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_exists: ${{ steps.check_tag.outputs.exists }}
    permissions:
      contents: write
      packages: write

    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: setup-rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: cache-registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: cache-git
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: cache-target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target
          key: ${{ runner.os }}-target-wasm-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-target-wasm-release-

      - name: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@arkavo-org'

      # Pinned release binary, checked against the SHA-256 recorded in the
      # action's manifest at this commit. Keep the version in step with
      # feature.yaml.
      - name: install-wasm-pack
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: wasm-pack@0.13.1
          fallback: none

      - name: build-wasm
        working-directory: crates/wasm
        run: wasm-pack build --release --target web --out-dir pkg-web --scope arkavo-org

      - name: test-wasm
        working-directory: crates/wasm
        run: |
          wasm-pack test --headless --firefox
          wasm-pack test --headless --chrome

      - name: get-version
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version from Cargo.toml: $VERSION"

      - name: check-tag-exists
        id: check_tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag $VERSION already exists, skipping release"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ Tag $VERSION does not exist, will create release"
          fi

      - name: create-archive
        run: |
          cd crates/wasm
          tar -czf ../../opentdf-wasm-web.tar.gz -C pkg-web .

      - name: generate-checksum
        run: sha256sum opentdf-wasm-web.tar.gz > opentdf-wasm-web.tar.gz.sha256

      - name: create-tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "✅ Created and pushed tag: $VERSION"

      - name: publish-npm
        if: steps.check_tag.outputs.exists == 'false'
        working-directory: crates/wasm/pkg-web
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Check if version already published
          if npm view @arkavo-org/opentdf-wasm@$VERSION 2>/dev/null; then
            echo "⚠️ Version $VERSION already published to npm, skipping"
            exit 0
          fi
          npm publish
          echo "✅ Published to npm: @arkavo-org/opentdf-wasm@$VERSION"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: create-release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: OpenTDF WASM ${{ steps.version.outputs.version }}
          body: |
            ## OpenTDF WASM ${{ steps.version.outputs.version }}

            WebAssembly bindings for OpenTDF (Trusted Data Format) - Browser target

            ### Download

            - `opentdf-wasm-web.tar.gz` - Web browser target (ES modules)

            ### Usage

            ```javascript
            import init, { tdf_create, tdf_decrypt_with_kas, version } from './opentdf_wasm.js';
            await init();
            console.log('OpenTDF version:', version());
            ```

            See the [WASM README](https://github.com/arkavo-org/opentdf-rs/blob/main/crates/wasm/README.md) for complete documentation.

            ### Verification

            Verify download with SHA256 checksum:
            ```bash
            sha256sum -c opentdf-wasm-web.tar.gz.sha256
            ```
          files: |
            opentdf-wasm-web.tar.gz
            opentdf-wasm-web.tar.gz.sha256
          draft: false
          prerelease: false

      - name: upload-artifacts
        if: steps.check_tag.outputs.exists == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opentdf-wasm-latest
          path: |
            opentdf-wasm-web.tar.gz
            opentdf-wasm-web.tar.gz.sha256
          retention-days: 90

      - name: summary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG_EXISTS="${{ steps.check_tag.outputs.exists }}"

          echo "## WASM Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** $VERSION (from Cargo.toml)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** Web (ES Modules)" >> $GITHUB_STEP_SUMMARY

          if [ "$TAG_EXISTS" == "false" ]; then
            echo "**Release:** ✅ Created new release" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Release:** ⚠️ Tag already exists, no release created" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Bundle Sizes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Archive" >> $GITHUB_STEP_SUMMARY
          ls -lh opentdf-wasm-web.tar.gz | awk '{print "- " $9 ": " $5}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### WASM File" >> $GITHUB_STEP_SUMMARY
          ls -lh crates/wasm/pkg-web/*.wasm | awk '{print "- " $9 ": " $5}' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checksum" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat opentdf-wasm-web.tar.gz.sha256 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  crates-io:
    name: crates.io
    needs: build
    if: needs.build.outputs.tag_exists == 'false'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # crates.io Trusted Publishing is bound to the workflow *filename*
      # `crates-io.yml`. A `workflow_call` from here mints an OIDC token whose
      # workflow claim is `release.yaml`, which crates.io rejects (0.15.0
      # release, run 33290929285). Dispatching the workflow by API keeps the
      # claim on `crates-io.yml`; workflow_dispatch events raised with
      # GITHUB_TOKEN do run (unlike pushes and tags).
      - name: dispatch crates-io.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run crates-io.yml --repo "$GITHUB_REPOSITORY" --ref "${{ needs.build.outputs.version }}"
