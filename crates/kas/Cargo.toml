[package]
name = "opentdf-kas"
version.workspace = true
edition = "2024"
rust-version = "1.91"
description = "OpenTDF KAS (Key Access Service) server-side crypto operations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arkavo-org/opentdf-rs"
authors = ["Arkavo LLC <info@arkavo.com>"]
documentation = "https://docs.rs/opentdf-kas"
homepage = "https://github.com/arkavo-org/opentdf-rs"
keywords = ["opentdf", "kas", "cryptography", "nanotdf", "rewrap"]
categories = ["cryptography"]
readme = "README.md"

[dependencies]
# Elliptic curve cryptography
p256 = { workspace = true }

# AES-GCM for rewrap operations
aes-gcm.workspace = true

# Key derivation
hkdf.workspace = true
sha2.workspace = true

# Encoding
base64.workspace = true
pem = "3.0"

# Error handling
thiserror.workspace = true

# Serialization
serde.workspace = true

# Random number generation
rand.workspace = true

# RSA support (optional)
# rsa 0.10 is the first release with the fix for RUSTSEC-2023-0071 (Marvin attack)
rsa = { version = "0.10", optional = true }
# SHA-1 for RSA-OAEP. rsa 0.10 takes digest 0.11 hashes, so this is 0.11 rather than
# the workspace 0.10; nothing else in this crate uses or re-exports sha1.
sha1 = { version = "0.11", optional = true }
# System RNG (rand_core 0.10) for RSA key generation; the workspace `rand` 0.8 RNGs
# do not implement the traits rsa 0.10 takes
getrandom = { version = "0.4", features = ["sys_rng"], optional = true }

[features]
default = ["ec"]
ec = []
rsa = ["dep:rsa", "dep:sha1", "dep:getrandom"]

[dev-dependencies]
tokio = { workspace = true }
hex = "0.4"

# The default client-side RSA backend, for the cross-backend test of `rsa_unwrap`
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
aws-lc-rs = "1.18"
