# cargo-deny configuration for opentdf-rs
# See https://embarkstudios.github.io/cargo-deny/

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]
# Check every feature of every workspace crate, so advisories, licenses and
# bans in optional dependencies (native-tls, mbedtls, rsa, ...) are seen too.
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # rsa 0.9 (Marvin attack, timing side channel in RSA private-key
    # operations); fixed only in rsa >= 0.10. The crate is pulled in solely by
    # opt-in features that are documented as affected: `kas-client-rustcrypto`
    # / `rustcrypto-rsa` (opentdf), `rustcrypto-provider` / `rustcrypto-rsa`
    # (opentdf-crypto) and `rsa` (opentdf-kas). Default builds use aws-lc-rs
    # (constant-time) and browser WASM uses WebCrypto. Moving to rsa 0.10 is
    # tracked separately; remove this entry when that lands.
    { id = "RUSTSEC-2023-0071", reason = "opt-in rustcrypto RSA backend only; documented in README and SECURITY.md; rsa 0.10 bump tracked separately" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    # webpki-roots uses this permissive data license
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
# Skip duplicate version warnings for these crates
# These are transitive dependencies with version mismatches in the ecosystem
skip = [
    { name = "getrandom" },
    { name = "untrusted" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
